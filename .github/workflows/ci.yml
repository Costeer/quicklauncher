name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  variants:
    name: ${{ matrix.channel }} variant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            tasks: :app:assembleStableDebug :app:lintStableDebug :app:testStableDebugUnitTest
          - channel: preview
            tasks: :app:assemblePreviewDebug :app:lintPreviewDebug :app:testPreviewDebugUnitTest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build, lint, and test
        run: ./gradlew --stacktrace ${{ matrix.tasks }}

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check dependencies and licenses
        run: >-
          ./gradlew --stacktrace --no-configuration-cache
          checkModuleBoundaries
          verifyNoGoogleDependencies
          buildHealth
          :app:licensee

  phase-zero-probes:
    name: Phase 0 probes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build and test Phase 0 proofs
        run: >-
          ./gradlew --stacktrace
          :contracts:domain:test
          :prototypes:nested-scroll:assembleDebug
          :prototypes:nested-scroll:lintDebug
          :prototypes:nested-scroll:testDebugUnitTest
          :prototypes:nested-scroll:licensee
          :prototypes:platform-probe:assembleDebug
          :prototypes:platform-probe:lintDebug
          :prototypes:platform-probe:testDebugUnitTest
          :prototypes:platform-probe:licensee
          :prototypes:widget-neighbors:assembleDebug
          :prototypes:widget-neighbors:lintDebug
          :prototypes:widget-neighbors:testDebugUnitTest
          :prototypes:widget-neighbors:licensee

  phase-one-contracts:
    name: Phase 1 contracts and registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test contracts, processor, fakes, and samples
        run: >-
          ./gradlew --stacktrace
          :contracts:domain:test
          :contracts:contribution:test
          :contracts:ui:test
          :registry:annotations:build
          :registry:ksp:test
          :testing:contracts:build
          :testing:fakes:test
          :testing:samples:assembleDebug
          :testing:samples:lintDebug
          :testing:samples:testDebugUnitTest
          :testing:samples:testReleaseUnitTest
          :testing:samples:verifyPaparazziDebug
          :contracts:domain:licensee
          :contracts:contribution:licensee
          :contracts:ui:licensee
          :registry:annotations:licensee
          :registry:ksp:licensee
          :testing:contracts:licensee
          :testing:fakes:licensee
          :testing:samples:licensee

  nested-scroll-emulator:
    name: Nested-scroll API 35 emulator
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run nested-scroll instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          script: ./gradlew --stacktrace :prototypes:nested-scroll:connectedDebugAndroidTest
