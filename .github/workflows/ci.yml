name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  variants:
    name: ${{ matrix.channel }} variant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            tasks: :app:assembleStableDebug :app:assembleStableRelease :app:lintStableDebug :app:lintStableRelease :app:testStableDebugUnitTest :app:testStableReleaseUnitTest
          - channel: preview
            tasks: :app:assemblePreviewDebug :app:assemblePreviewRelease :app:lintPreviewDebug :app:lintPreviewRelease :app:testPreviewDebugUnitTest :app:testPreviewReleaseUnitTest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build, lint, and test
        run: ./gradlew --stacktrace ${{ matrix.tasks }}

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate workflow syntax
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/actionlint-bin/actionlint" .github/workflows/ci.yml

      - name: Check changed lines for whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$GITHUB_SHA"
          else
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Check dependencies and licenses
        run: >-
          ./gradlew --stacktrace --no-configuration-cache
          checkModuleBoundaries
          verifyNoGoogleDependencies
          buildHealth
          :app:licensee

  phase-zero-probes:
    name: Phase 0 probes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build and test Phase 0 proofs
        run: >-
          ./gradlew --stacktrace
          :contracts:domain:test
          :prototypes:nested-scroll:assembleDebug
          :prototypes:nested-scroll:lintDebug
          :prototypes:nested-scroll:testDebugUnitTest
          :prototypes:nested-scroll:licensee
          :prototypes:platform-probe:assembleDebug
          :prototypes:platform-probe:lintDebug
          :prototypes:platform-probe:testDebugUnitTest
          :prototypes:platform-probe:licensee
          :prototypes:widget-neighbors:assembleDebug
          :prototypes:widget-neighbors:lintDebug
          :prototypes:widget-neighbors:testDebugUnitTest
          :prototypes:widget-neighbors:licensee

  phase-one-contracts:
    name: Phase 1 contracts and registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test contracts, processor, fakes, and samples
        run: >-
          ./gradlew --stacktrace
          :contracts:domain:test
          :contracts:contribution:test
          :contracts:ui:test
          :registry:annotations:build
          :registry:ksp:test
          :testing:contracts:build
          :testing:fakes:test
          :testing:samples:assembleDebug
          :testing:samples:lintDebug
          :testing:samples:testDebugUnitTest
          :testing:samples:testReleaseUnitTest
          :testing:samples:verifyPaparazziDebug
          :contracts:domain:licensee
          :contracts:contribution:licensee
          :contracts:ui:licensee
          :registry:annotations:licensee
          :registry:ksp:licensee
          :testing:contracts:licensee
          :testing:fakes:licensee
          :testing:samples:licensee

  phase-two-persistence:
    name: Phase 2 persistence and spatial state
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build, lint, and test persistence
        run: >-
          ./gradlew --stacktrace
          :host:data:assembleDebug
          :host:data:assembleRelease
          :host:data:lintDebug
          :host:data:testDebugUnitTest
          :host:data:testReleaseUnitTest
          :host:data:licensee
          :host:platform:assembleDebug
          :host:platform:assembleRelease
          :host:platform:lintDebug
          :host:platform:licensee

      - name: Verify checked-in Room schemas
        run: |
          schema_status="$(git status --porcelain --untracked-files=all -- host/data/schemas)"
          if [[ -n "$schema_status" ]]; then
            echo "Room schema exports are stale or untracked:"
            echo "$schema_status"
            exit 1
          fi

  phase-two-persistence-emulator:
    name: Phase 2 persistence API 35 emulator
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run persistence instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          script: ./gradlew --stacktrace :host:data:connectedDebugAndroidTest

  phase-three-safe-launcher:
    name: Phase 3 safe launcher
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build, lint, test, and verify launcher visuals
        run: >-
          ./gradlew --stacktrace
          :host:runtime:assembleDebug
          :host:runtime:assembleRelease
          :host:runtime:lintDebug
          :host:runtime:testDebugUnitTest
          :host:runtime:testReleaseUnitTest
          :host:runtime:verifyPaparazziDebug
          :host:runtime:licensee
          :host:settings:assembleDebug
          :host:settings:assembleRelease
          :host:settings:lintDebug
          :host:settings:testDebugUnitTest
          :host:settings:testReleaseUnitTest
          :host:settings:verifyPaparazziDebug
          :host:settings:licensee
          :host:platform:testDebugUnitTest
          :host:platform:testReleaseUnitTest

  phase-three-safe-launcher-emulator:
    name: Phase 3 safe launcher API 35 emulator
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Home, app-catalog, persistence, and recovery tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          script: ./gradlew --stacktrace :app:connectedStableDebugAndroidTest

  phase-four-composition:
    name: Phase 4 composition, navigation, editors, and modules
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test contracts and registry generation
        run: >-
          ./gradlew --stacktrace
          :contracts:domain:test
          :contracts:contribution:test
          :contracts:ui:test
          :registry:annotations:build
          :registry:ksp:test
          :registry:production:assembleDebug
          :registry:production:assembleRelease
          :registry:production:lintDebug
          :registry:production:lintRelease
          :registry:production:testDebugUnitTest
          :registry:production:testReleaseUnitTest
          :registry:annotations:licensee
          :registry:ksp:licensee
          :registry:production:licensee

      - name: Build, lint, and test reference contributions
        run: >-
          ./gradlew --stacktrace
          :modules:layout:core:assembleDebug
          :modules:layout:core:assembleRelease
          :modules:layout:core:lintDebug
          :modules:layout:core:lintRelease
          :modules:layout:core:testDebugUnitTest
          :modules:layout:core:testReleaseUnitTest
          :modules:layout:core:verifyPaparazziDebug
          :modules:layout:core:licensee
          :modules:block:core:assembleDebug
          :modules:block:core:assembleRelease
          :modules:block:core:lintDebug
          :modules:block:core:lintRelease
          :modules:block:core:testDebugUnitTest
          :modules:block:core:testReleaseUnitTest
          :modules:block:core:verifyPaparazziDebug
          :modules:block:core:licensee
          :modules:templates:core:build
          :modules:templates:core:test
          :modules:templates:core:licensee

      - name: Build, lint, test, and verify host visuals
        run: >-
          ./gradlew --stacktrace
          :host:runtime:assembleDebug
          :host:runtime:assembleRelease
          :host:runtime:lintDebug
          :host:runtime:lintRelease
          :host:runtime:testDebugUnitTest
          :host:runtime:testReleaseUnitTest
          :host:runtime:verifyPaparazziDebug
          :host:runtime:licensee
          :host:editor:assembleDebug
          :host:editor:assembleRelease
          :host:editor:lintDebug
          :host:editor:lintRelease
          :host:editor:testDebugUnitTest
          :host:editor:testReleaseUnitTest
          :host:editor:verifyPaparazziDebug
          :host:editor:licensee

  phase-four-emulator:
    name: Phase 4 production launcher API 35 AOSP emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run production Phase 4 and Phase 5 launcher tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          script: >-
            ./gradlew --stacktrace
            :host:platform:connectedDebugAndroidTest
            :host:runtime:connectedDebugAndroidTest
            :host:editor:connectedDebugAndroidTest
            :app:connectedStableDebugAndroidTest

  nested-scroll-emulator:
    name: Nested-scroll API 35 emulator
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run nested-scroll instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7
          script: ./gradlew --stacktrace :prototypes:nested-scroll:connectedDebugAndroidTest
